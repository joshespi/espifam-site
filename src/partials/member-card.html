<li>
  <a href="/{{slug}}/" class="member-card" data-member="{{slug}}">
    <div class="flex items-center gap-5">
      <div class="avatar"><img src="/assets/avatars/{{avatar}}.webp" alt="" width="88" height="88" /></div>
      <div>
        <div class="text-xs text-faint uppercase tracking-wider mb-1">{{role}}</div>
        <div class="text-xl font-bold">{{name}}</div>
        <div class="text-sm text-muted">{{blurb}}</div>
      </div>
    </div>
  </a>
</li>
