<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{title}}</title>
<meta name="description" content="{{description}}" />
<meta name="theme-color" content="#09090b" />
{{#if noindex}}<meta name="robots" content="noindex" />{{/if}}
<script>
  // Inline so the theme is applied before first paint (no dark-to-light flash).
  (() => {
    const KEY = 'espifam-theme';
    const root = document.documentElement;
    const themeColor = document.querySelector('meta[name="theme-color"]');
    const apply = (theme) => {
      root.dataset.theme = theme;
      themeColor.content = theme === 'light' ? '#fafafa' : '#09090b';
    };

    let theme;
    try { theme = localStorage.getItem(KEY); } catch (e) {}
    if (theme !== 'light' && theme !== 'dark') {
      theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    }
    apply(theme);

    document.addEventListener('click', (e) => {
      if (!e.target.closest('[data-theme-toggle]')) return;
      apply(root.dataset.theme === 'light' ? 'dark' : 'light');
      try { localStorage.setItem(KEY, root.dataset.theme); } catch (err) {}
    });
  })();
</script>
<link rel="stylesheet" href="/styles.css?v={{cssVersion}}" />
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
{{#if !noindex}}<link rel="canonical" href="{{url}}" />{{/if}}
<meta property="og:site_name" content="espifam" />
<meta property="og:type" content="website" />
<meta property="og:title" content="{{title}}" />
<meta property="og:description" content="{{description}}" />
{{#if !noindex}}<meta property="og:url" content="{{url}}" />{{/if}}
<meta property="og:image" content="{{site}}/assets/og/{{image}}.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta name="twitter:card" content="summary_large_image" />
