<figure class="inline-flex flex-col items-center gap-1.5">
  <button type="button" data-lightbox data-full="{{src}}.webp" class="thumb-button">
    <img src="{{src}}-thumb.webp" alt="{{alt}} — enlarge" width="96" height="96" loading="lazy" class="thumb" />
  </button>
  <figcaption class="text-xs text-faint">{{caption}}</figcaption>
</figure>
